plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
//mod_version = "${mod_version}${fabricVersionAppend}"
version = mod_version

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly "maven.modrinth:jade:26.2.9+fabric"
    compileOnly "maven.modrinth:continuity:3.0.1+26.2"
    compileOnly "maven.modrinth:serene-seasons:26.1.2.0.4"
    compileOnly "maven.modrinth:glitchcore:26.2.0.0.0" // transitive API of serene-seasons, needed at compile time
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2' // javax.annotation used by common sources
}

// Ship the generated data (tags, loot tables) in the fabric jar too. The generated assets
// (blockstates using the custom "dynamictrees:branch" model type) stay neoforge-only —
// the fabric model layer replaces branch models after bake and cannot parse them.
processResources {
    from(project(':common').file('src/generated/resources')) {
        include 'data/**'
    }
}

loom {
    def aw = project(':common').file("src/main/resources/META-INF/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
