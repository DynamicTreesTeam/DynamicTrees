import me.modmuss50.mpp.ReleaseType

plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}
version = "${fabricVersion}"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

}

loom {
    def aw = project(':common').file("src/main/resources/META-INF/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        datagen {
            client()
            setConfigName('Fabric Datagen')
            ideConfigGenerated(true)
            runDir('runs/datagen')
            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.output-dir=${project(':common').file('src/generated/resources')}")
            vmArg("-Dfabric-api.datagen.modid=${mod_id}")
        }
    }
    repositories {
        maven {
            url "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        flatDir {
            dir 'libs'
        }
    }
    dependencies {
        modImplementation "curse.maven:jade-324717:6011268"
        modImplementation "curse.maven:jei-238222:5846878"

        implementation("net.jodah:typetools:0.6.3")

        modImplementation "curse.maven:glitchcore-955399:5660741"
        modImplementation "curse.maven:serene-seasons-291874:5753502"
    }

    publishing {
        repositories {
            maven {
                url "file://${project.projectDir}/repo"
            }
            var mavenUsername = project.findProperty("harleyOConnorMavenUsername")?.toString() ?: System.getenv("MAVEN_USERNAME")
            var mavenPassword = project.findProperty("harleyOConnorMavenPassword")?.toString() ?: System.getenv("MAVEN_PASSWORD")
            if (mavenUsername == null || mavenPassword == null) {
                logger.log(LogLevel.WARN,"Credentials for maven not detected; it will be disabled.")
                return
            }
            maven {
                name = "HarleyOConnor"
                url = "https://harleyoconnor.com/maven"
                credentials {
                    username = mavenUsername
                    password = mavenPassword
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def changelogFile = file("../fabric/build/changelog.txt")

publishMods {
    file = remapJar.archiveFile
    displayName = "${mod_name.replace(' ','')}-Fabric-${minecraft_version} ${fabricVersion}"
    if (changelogFile.exists()) {
        changelog.set(changelogFile.getText())
    }
    type = ReleaseType.of(fabricVersionType.toUpperCase())
    modLoaders.add("fabric")
    modLoaders.add("quilt")
    curseforge {
        projectId = "252818"
        projectSlug = "dynamictrees"
        accessToken = curseApiKey ?: System.getenv("CURSEFORGE_API_KEY")
        minecraftVersions.add("1.21.1")
//        optional("dynamictreesplus")
        requires("forge-config-api-port")
    }
    modrinth {
        projectId = "vdjF5PL5"
        minecraftVersions.add("1.21.1")
        accessToken = modrinthToken ?: System.getenv("MODRINTH_TOKEN")
//        optional("qaO9Dqpu")
        requires("ohNO6lps")
    }
}
